name = "hyrule-herb-apothecary"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
main = ".output/server/index.mjs"

[assets]
directory = ".output/public"

[[routes]]
pattern = "hyruleherb.xyz"
zone_name = "hyruleherb.xyz"
custom_domain = true

[vars]
PRESIDENT_EMAIL = "blackhatterxvi@gmail.com"
# Public Supabase values can live here or in the Cloudflare dashboard.
# VITE_SUPABASE_URL = "https://your-project.supabase.co"
